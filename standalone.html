  mound.rotation.y=U.rand(-0.03,0.03);
  g.add(mound);

  const top=new THREE.Mesh(
    new THREE.BoxGeometry(3.44, 0.06, 4.24),
    new THREE.MeshStandardMaterial({ color:'#6fbf6b', roughness:0.85 })
  );
  top.position.y=0.53;
  g.add(top);

  const road=new THREE.Mesh(
    new THREE.BoxGeometry(3.44, 0.05, 1.5),
    new THREE.MeshStandardMaterial({ map:U.pathTex(), roughness:0.95 })
  );
  road.position.y=0.565;
  g.add(road);

  const sign=U.emojiSprite('🪧', 0.9);
  sign.position.set(-1.15, 1.25, -1.2);
  g.add(sign);

  for(let i=0;i<4;i++){
    const h=U.rand(0.9,1.7);
    const stem=new THREE.Mesh(
      new THREE.CylinderGeometry(0.016,0.024,h,6),
      new THREE.MeshStandardMaterial({color:'#5d8a4a', roughness:0.9})
    );
    stem.position.set(U.rand(-1.6,1.6), h/2+0.55, (i<2?-1:1)*U.rand(1.5,1.9));
    const tip=new THREE.Mesh(
      new THREE.CylinderGeometry(0.05,0.05,0.3,8),
      new THREE.MeshStandardMaterial({color:'#7a4a2e', roughness:0.95})
    );
    tip.position.set(stem.position.x, h+0.62, stem.position.z);
    g.add(stem,tip);
  }

  P.scene.add(g);
  return g;
};

/* ================= 每帧推进 ================= */
P.update = function(dt){
  P.time += dt;
  P.water.material.uniforms.uTime.value = P.time;

  /* 天穹 / 水面 / 星带 / 月亮跟随镜头（世界无限延伸的关键） */
  P.sky.position.x = P.camX;
  P.water.position.x = P.camX;
  P.stars.position.x = P.camX;
  P.moon.position.x = P.camX - 26;

  /* 太阳起落 */
  const ph = P._target || FJ.PHASES[0];
  const sp = P._sunP || 0;
  const tx = U.lerp(ph.sunFrom.x, ph.sunTo.x, sp);
  const ty = U.lerp(ph.sunFrom.y, ph.sunTo.y, sp);
  P.sunLX = U.damp(P.sunLX, tx, 1.6, dt);
  P.sunLY = U.damp(P.sunLY, ty, 1.6, dt);
  U.dampColor(P.sunDisc.material.color, new THREE.Color(
    sp<0.5?ph.sunFrom.c:ph.sunTo.c), 2, dt);
  P.sun.position.set(P.camX + P.sunLX, P.sunLY, -85);
  P.sun.lookAt(P.camX, 0, 0);
  const sunAmt = (1-P.starAmt) * U.clamp(P.sunLY/4.5, 0, 1);
  P.sunDisc.material.opacity = sunAmt;
  P.sunHalo.material.opacity = sunAmt*0.9;

  /* 星月萤火（月亮只在深夜淡入，避免黄昏与太阳同框） */
  const moonAmt = Math.max(0, (P.starAmt - 0.45) / 0.55);
  P.stars.material.opacity = P.starAmt*0.9;
  P.moonDisc.material.opacity = moonAmt;
  P.moonHalo.material.opacity = moonAmt*0.75;
  P.fireflies.material.opacity = P.starAmt * (P.weather==='snow'?0.4:1);

  if(P.starAmt>0.02){
    const pos=P.fireflies.geometry.attributes.position.array;
    for(let i=0;i<P._flySeeds.length;i++){
      const s=P._flySeeds[i], t=P.time*s.sp+s.ph;
      pos[i*3]   = P.camX + s.bx + Math.sin(t)*0.9;
      pos[i*3+1] = 1.1 + Math.sin(t*s.vy)*0.55;
      pos[i*3+2] = s.bz + Math.cos(t*0.8)*0.9;
    }
    P.fireflies.geometry.attributes.position.needsUpdate=true;
  }

  /* ---- 雨 ---- */
  if(P.rain.visible){
    const pos=P.rain.geometry.attributes.position.array;
    for(let i=0;i<P._rainV.length;i++){
      pos[i*3+1]-=P._rainV[i]*dt;
      pos[i*3]-=1.6*dt;
      if(pos[i*3+1]<0.05){
        pos[i*3]=P.camX+U.rand(-11,13);
        pos[i*3+1]=U.rand(8,11);
        pos[i*3+2]=U.rand(-6,7);
      }
      if(pos[i*3]<P.camX-12) pos[i*3]=P.camX+U.rand(9,13);
    }
    P.rain.geometry.attributes.position.needsUpdate=true;
    /* 雨点打在水面上 */
    P._rainRippleT=(P._rainRippleT||0)-dt;
    if(P._rainRippleT<=0){
      P._rainRippleT=0.13;
      P.ripple(P.camX+U.rand(-8,10), U.rand(-5,6), 0.7, 0.5);
    }
  }
  /* ---- 雪 ---- */
  if(P.snow.visible){
    const pos=P.snow.geometry.attributes.position.array;
    for(let i=0;i<P._snowV.length;i++){
      pos[i*3+1]-=P._snowV[i]*dt;
      pos[i*3]+=Math.sin(P.time*0.9+i)*0.25*dt;
      if(pos[i*3+1]<0.05){
        pos[i*3]=P.camX+U.rand(-11,13);
        pos[i*3+1]=U.rand(7,10);
        pos[i*3+2]=U.rand(-6,7);
      }
    }
    P.snow.geometry.attributes.position.needsUpdate=true;
  }
  /* ---- 季节飘落物（花瓣/落叶） ---- */
  if(P.drift.visible){
    const pos=P.drift.geometry.attributes.position.array;
    for(let i=0;i<P._driftV.length;i++){
      pos[i*3+1]-=P._driftV[i]*dt;
      pos[i*3]+=Math.sin(P.time*0.7+i*1.3)*0.55*dt;
      if(pos[i*3+1]<0.05){
        pos[i*3]=P.camX+U.rand(-11,13);
        pos[i*3+1]=U.rand(5,9);
        pos[i*3+2]=U.rand(-6,7);
      }
    }
    P.drift.geometry.attributes.position.needsUpdate=true;
  }

  /* 涟漪 */
  for(const r of P.ripples){
    if(r.t<0) continue;
    r.t+=dt;
    const k=r.t/r.dur;
    if(k>=1){ r.t=-1; r.mesh.visible=false; continue; }
    const s=0.3+(r.scaleTo-0.3)*(1-Math.pow(1-k,3));
    r.mesh.scale.set(s,1,s);
    r.mesh.material.opacity=0.5*(1-k);
  }

  /* 水花 */
  for(const s of P.splashes){
    if(s.t<0) continue;
    s.t+=dt;
    const k=s.t/s.dur;
    if(k>=1){ s.t=-1; s.pts.visible=false; continue; }
    const pos=s.pts.geometry.attributes.position.array;
    for(let i=0;i<pos.length/3;i++){
      s.vel[i*3+1]-=9.8*dt;
      pos[i*3]  += s.vel[i*3]*dt;
      pos[i*3+1]+= s.vel[i*3+1]*dt;
      pos[i*3+2]+= s.vel[i*3+2]*dt;
      if(pos[i*3+1]<0.02){ pos[i*3+1]=0.02; s.vel[i*3+1]*=-0.35; }
    }
    s.pts.geometry.attributes.position.needsUpdate=true;
    s.pts.material.opacity=0.95*(1-k);
  }

  /* 彩带 */
  for(const s of P.confettis){
    if(s.t<0) continue;
    s.t+=dt;
    const k=s.t/s.dur;
    if(k>=1){ s.t=-1; s.pts.visible=false; continue; }
    const pos=s.pts.geometry.attributes.position.array;
    for(let i=0;i<pos.length/3;i++){
      s.vel[i*3+1]-=4.5*dt;
      s.vel[i*3]*=0.995; s.vel[i*3+2]*=0.995;
      pos[i*3]  += s.vel[i*3]*dt;
      pos[i*3+1]+= s.vel[i*3+1]*dt;
      pos[i*3+2]+= s.vel[i*3+2]*dt;
    }
    s.pts.geometry.attributes.position.needsUpdate=true;
    s.pts.material.opacity=1-Math.max(0,(k-0.6))/0.4;
  }
};

/* ================= 时辰过渡（颜色/光照/雾，含天气压暗） ================= */
P.applyPhase = function(dt){
  const L=6.5;
  const tgt=P._target||FJ.PHASES[0];
  const sky=P.sky.material.uniforms;
  U.dampColor(sky.uTop.value, new THREE.Color(tgt.skyTop), L, dt);
  U.dampColor(sky.uBot.value, new THREE.Color(tgt.skyBot), L, dt);
  U.dampColor(P.water.material.uniforms.uDeep.value, new THREE.Color(tgt.waterDeep), L, dt);
  U.dampColor(P.water.material.uniforms.uLite.value, new THREE.Color(tgt.waterLite), L, dt);
  U.dampColor(P.water.material.uniforms.uFogColor.value, new THREE.Color(tgt.fog), L, dt);
  P.hemi.intensity = U.damp(P.hemi.intensity, tgt.hemi*P.dim, L, dt);
  P.dir.intensity  = U.damp(P.dir.intensity,  tgt.dir*P.dim,  L, dt);
  U.dampColor(P.dir.color, new THREE.Color(tgt.dirColor), L, dt);
  if(P.scene.fog){
    U.dampColor(P.scene.fog.color, new THREE.Color(tgt.fog), L, dt);
    const nf = P.weather==='rain'?15 : P.weather==='snow'?12 : 22;
    const ff = P.weather==='rain'?58 : P.weather==='snow'?52 : 80;
    P.scene.fog.near = U.damp(P.scene.fog.near, nf, L, dt);
    P.scene.fog.far  = U.damp(P.scene.fog.far,  ff, L, dt);
    P.water.material.uniforms.uFogNear.value = P.scene.fog.near;
    P.water.material.uniforms.uFogFar.value  = P.scene.fog.far;
  }
  P.starAmt = U.damp(P.starAmt||0, P.starTarget||0, L, dt);
  const dimTgt = P.weather==='rain'?0.72 : P.weather==='snow'?0.88 : 1;
  P.dim = U.damp(P.dim, dimTgt, L, dt);
};
})();
</script>
<script>
/* ============================================================
   frog.js — 程序化青蛙（零素材）
   纯代码建模 + 状态机动画：
   待机呼吸 / 眨眼 / 鸣叫鼓腮 / 蓄力下蹲 / 腾空舒展 /
   落地压扁回弹 / 踩边摇晃 / 落水翻滚
   模型默认朝 +Z，由引擎设置 group 的位置与朝向
   ============================================================ */
(function(){
const FJ = window.FJ = window.FJ || {};
const U = FJ.utils;

FJ.Frog = function(scene){
  const g=this.group=new THREE.Group();

  this.body=new THREE.Group();
  g.add(this.body);

  const mat=(c,r=0.6)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
  const green=mat('#4fae5c'), dark=mat('#3c8f4a'),
        belly=mat('#d8ecab'), pink=mat('#ff9fb0');

  /* 身体 */
  const torso=new THREE.Mesh(new THREE.SphereGeometry(0.34,20,16), green);
  torso.scale.set(0.92,0.78,1.05); torso.position.y=0.3;
  this.body.add(torso);

  const bel=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12), belly);
  bel.scale.set(0.8,0.62,0.95); bel.position.set(0,0.24,0.06);
  this.body.add(bel);

  /* 眼睛（可眨） */
  this.eyes=[];
  for(const s of [-1,1]){
    const eg=new THREE.Group();
    eg.position.set(s*0.15,0.55,0.16);
    const white=new THREE.Mesh(new THREE.SphereGeometry(0.095,14,12), mat('#ffffff',0.35));
    const pupil=new THREE.Mesh(new THREE.SphereGeometry(0.048,10,10), mat('#20242b',0.3));
    pupil.position.set(0,0.01,0.07);
    eg.add(white,pupil);
    this.body.add(eg); this.eyes.push(eg);
  }

  /* 腮红 */
  for(const s of [-1,1]){
    const c=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,8), pink);
    c.position.set(s*0.19,0.32,0.28); c.scale.set(1,0.7,0.5);
    this.body.add(c);
  }

  /* 喉囊（鸣叫时鼓起） */
  this.throat=new THREE.Mesh(new THREE.SphereGeometry(0.11,12,10), belly);
  this.throat.position.set(0,0.18,0.3);
  this.throat.scale.set(1,0.7,0.6);
  this.body.add(this.throat);

  /* 后腿（折叠的大腿 + 蹼足） */
  for(const s of [-1,1]){
    const thigh=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,10), dark);
    thigh.scale.set(0.62,0.55,1.15); thigh.position.set(s*0.27,0.18,-0.14);
    const foot=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8), dark);
    foot.scale.set(0.7,0.3,1.3); foot.position.set(s*0.24,0.03,0.16);
    this.body.add(thigh,foot);
  }
  /* 前腿（撑地的小手） */
  for(const s of [-1,1]){
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.045,0.26,8), dark);
    arm.position.set(s*0.14,0.12,0.27); arm.rotation.x=0.15;
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8), dark);
    hand.scale.set(0.8,0.35,1.2); hand.position.set(s*0.15,0.015,0.31);
    this.body.add(arm,hand);
  }

  scene.add(g);

  this.pose={ charge:0, air:-1, airDur:1, squash:0, wobble:0, dead:false };
  this._blinkT=U.rand(1.5,3.5); this._blink=0; this._croakT=0;
  this.reset();
};

FJ.Frog.prototype.reset=function(){
  const P=this.pose;
  P.charge=0; P.air=-1; P.squash=0; P.wobble=0; P.dead=false;
  this.group.rotation.set(0,0,0);
  this.body.rotation.set(0,0,0);
  this.body.scale.set(1,1,1);
};

/* 蓄力 0..1（引擎每帧喂） */
FJ.Frog.prototype.setCharge=function(p){ this.pose.charge=U.clamp(p,0,1); };

/* 起跳：记录飞行时长，air 进度由引擎每帧喂 */
FJ.Frog.prototype.startJump=function(T){
  this.pose.air=0; this.pose.airDur=T;
};
FJ.Frog.prototype.setAir=function(k){
  if(this.pose.air>=0) this.pose.air=k;
};

/* 落地：squash 压扁脉冲；edge 时附加摇晃 */
FJ.Frog.prototype.onLand=function(edge){
  this.pose.air=-1;
  this.pose.squash=1;
  if(edge) this.pose.wobble=1;
};

FJ.Frog.prototype.die=function(){ this.pose.dead=true; };

/* 呱～ */
FJ.Frog.prototype.croak=function(){ this._croakT=0.55; };

FJ.Frog.prototype.update=function(dt, t){
  const P=this.pose;

  /* 眨眼 */
  this._blinkT-=dt;
  if(this._blinkT<=0){ this._blink=0.14; this._blinkT=U.rand(2,4.5); }
  if(this._blink>0) this._blink-=dt;
  const eyeS=this._blink>0?0.15:1;
  for(const e of this.eyes) e.scale.y=U.damp(e.scale.y,eyeS,30,dt);

  /* 鸣叫鼓腮 */
  if(this._croakT>0){
    this._croakT-=dt;
    const k=Math.sin((1-Math.max(this._croakT,0)/0.55)*Math.PI);
    this.throat.scale.set(1+k*0.8, 0.7+k*0.55, 0.6+k*0.4);
  }else{
    this.throat.scale.set(1,0.7,0.6);
  }

  /* 姿态：呼吸 / 蓄力下蹲 / 腾空舒展 / 落地压扁 */
  const br=1+Math.sin(t*2.2)*0.012;
  let sy=br, sxz=1, pitch=0;

  if(!P.dead){
    if(P.air<0){                       /* 地面 */
      sy*=1-0.26*P.charge;
      sxz=1+0.16*P.charge;
      pitch=P.charge*0.3;              /* 蓄势前倾 */
    }else{                             /* 空中 */
      const k=Math.min(P.air,1), st=Math.sin(Math.PI*k);
      sy*=1+0.3*st; sxz=1-0.08*st;
      pitch=-0.35+0.95*k;              /* 起跳仰头 → 落地俯身 */
    }
  }
  if(P.squash>0){
    P.squash=Math.max(0,P.squash-dt*3.6);
    const q=P.squash;
    sy*=1-0.4*q*q; sxz*=1+0.22*q*q;
  }
  this.body.scale.set(sxz,sy,sxz);
  this.body.rotation.x=U.damp(this.body.rotation.x,pitch,12,dt);

  /* 踩边摇晃（左右打滚） */
  if(P.wobble>0){
    P.wobble=Math.max(0,P.wobble-dt*1.05);
    this.group.rotation.z=Math.sin(t*17)*0.3*P.wobble;
  }else{
    this.group.rotation.z=U.damp(this.group.rotation.z,0,10,dt);
  }

  /* 落水翻滚 */
  if(P.dead) this.body.rotation.x+=dt*5;
};
})();
</script>
<script>
/* ============================================================
   engine.js — 游戏引擎（QTE 卡点跳格）
   玩法循环：
   光标在进度条上快速扫动 → 按【空格】卡点 →
   卡进绿区 = 起跳一格（金色正中 = 完美·连击）→
   卡偏 = 落水 → 重头再来（回到第 1 格）
   每 10 格是一座堤岸：渡塘庆祝 + 换时辰 + 难度提升
   ============================================================ */
(function(){
const FJ = window.FJ = window.FJ || {};
const U = FJ.utils;
const C = FJ.CFG;

FJ.Engine = function(canvas){
  const S=this.store=FJ.store;

  this.renderer=new THREE.WebGLRenderer({canvas, antialias:true});
  this.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  this.renderer.outputEncoding=THREE.sRGBEncoding;

  this.scene=new THREE.Scene();
  this.scene.fog=new THREE.Fog(new THREE.Color(FJ.PHASES[0].fog), 22, 80);

  this.camera=new THREE.PerspectiveCamera(48, 1, 0.1, 300);

  FJ.pond.init(this.scene);
  FJ.pond.setPhaseTarget(FJ.PHASES[0]);
  FJ.pond.applyPhase(10);

  /* 伪阴影 */
  this.shadow=new THREE.Mesh(
    new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({ map:U.softDot('rgba(6,40,24,1)'), transparent:true, opacity:0.32, depthWrite:false })
  );
  this.shadow.rotation.x=-Math.PI/2;
  this.scene.add(this.shadow);

  this.frog=new FJ.Frog(this.scene);

  /* 对局状态 */
  this.slots=[];          // 站点数组：荷叶与堤岸（剪枝后留 null）
  this.spawned=0;
  this.cur=0;             // 青蛙所在站点
  this.landed=0;          // 已跳过格数（=分数）
  this.state='aim';       // aim(光标扫动) | fly(腾空) | fail(落水演出)
  this.time=0;
  this.camX=0;
  this._idleCroak=U.rand(2,5);
  this._pendingPerfect=false;

  this._resetWorld();

  this._bindInput();
  window.addEventListener('resize', ()=>this._resize());
  this._resize();

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && S.screen==='play') S.paused=true;
  });

  this.clock=new THREE.Clock();
  const loop=()=>{ requestAnimationFrame(loop); this._frame(); };
  requestAnimationFrame(loop);
};

/* ================= 世界重置 ================= */
FJ.Engine.prototype._resetWorld=function(){
  const S=this.store;
  for(const p of this.slots){
    if(p){
      U.disposeGroup(p.group); this.scene.remove(p.group);
      for(const d of p.deco){ U.disposeGroup(d); this.scene.remove(d); }
    }
  }
  this.slots=[]; this.spawned=0; this.cur=0; this.landed=0;
  this.state='aim'; this.camX=0; this._pendingPerfect=false;
  this.sinkDeadline=-1; this.fail=null; this.shake=0; this.failT=-1;

  S.score=0; S.combo=0; S.maxCombo=0; S.perfects=0; S.jumps=0;
  S.pondIdx=1; S.padInPond=0;
  S.paused=false; S.over=null;
  this.weather='clear'; this._thunderT=99;

  /* 起点即第一塘风景（夏·正午） */
  this._applyScene(1, false);

  /* 起点堤岸 + 前 3 片荷叶 */
  this._spawnSlot(0);
  while(this.spawned<4) this._spawnSlot();

  /* 青蛙站上起点 */
  const s0=this.slots[0];
  this._standOffset=0;
  this.frog.reset();
  this.frog.group.position.set(s0.x, s0.topY, s0.z);
  this.frog.group.rotation.y=Math.PI/2;   // 朝 +X 前进方向
  this.camX=s0.x;
  this._newQte();
};

FJ.Engine.prototype.startGame=function(){
  this._resetWorld();
  this.store.screen='play';
};

FJ.Engine.prototype.toHome=function(){
  this._resetWorld();
  this.store.screen='start';
};

/* ================= 站点生成 ================= */
FJ.Engine.prototype._spawnSlot=function(){
  const idx=this.spawned++;
  const isBank = idx % C.POND_SIZE === 0;
  const prev=this.slots[idx-1];
  let x, z, r, topY;

  if(!prev){ /* 起点堤岸 */
    x=0; z=0; r=2.3; topY=0.56;
  }else if(isBank){
    x=prev.x + U.rand(2.5,3.0);
    z=0; r=2.3; topY=0.56;
  }else{
    const ramp=U.clamp(idx/C.GAP_RAMP,0,1);
    const gap=U.rand(C.GAP_MIN, U.lerp(C.GAP_MAX0, C.GAP_MAX1, ramp));
    x=prev.x + gap;
    z=U.rand(-0.55,0.55);
    r=U.clamp(C.PAD_R_MAX-idx*C.PAD_SHRINK, C.PAD_R_MIN, C.PAD_R_MAX)*U.rand(0.94,1.06);
    topY=0.09;
  }

  const slot={
    idx, x, z, baseZ:z, r, topY, bank:isBank,
    group:null, leaf:null, deco:[],
    moving:false, ampZ:0, spd:U.rand(1.0,1.6), ph:U.rand(0,Math.PI*2),
    sinking:false, sinkK:0,
    bug:null, tilt:0,
  };

  if(isBank){
    slot.group=FJ.pond.createBank(x);
  }else{
    slot.group=FJ.pond.createPad(x, z, r, {x:1,z:0});
    slot.leaf=slot.group.children[0];
    /* 远景荷叶：让沿途水面不空（顺带展示当季风景） */
    if(Math.random()<0.55){
      const nD=Math.random()<0.3?2:1;
      for(let d=0;d<nD;d++){
        slot.deco.push(FJ.pond.createPad(
          x+U.rand(-7,13),
          z+(Math.random()<0.5?-1:1)*U.rand(6,15),
          U.rand(0.8,1.5), {x:1,z:0}
        ));
      }
    }
    /* 难度开关 */
    if(idx>=C.DRIFT_FROM && Math.random()<C.DRIFT_CHANCE){
      slot.moving=true;
      slot.ampZ=U.lerp(0.6, 1.2, U.clamp(idx/40,0,1));
    }else if(idx>=C.SINK_FROM && Math.random()<C.SINK_CHANCE){
      slot.sinking=true;
    }
    /* 冬天没有蝴蝶 */
    if(idx>=3 && FJ.pond.seasonKey!=='winter' && Math.random()<0.13 && !slot.moving){
      slot.bug=FJ.pond.addBug(slot.group);
    }
  }
  this.slots[idx]=slot;
  return slot;
};

FJ.Engine.prototype._ensureSlots=function(){
  while(this.spawned < this.cur+4) this._spawnSlot();
  for(let i=0;i<this.cur-4;i++){
    const p=this.slots[i];
    if(p){
      U.disposeGroup(p.group); this.scene.remove(p.group);
      for(const d of p.deco){ U.disposeGroup(d); this.scene.remove(d); }
      this.slots[i]=null;
    }
  }
};

/* 站点当前顶面高度（荷叶随波浮沉 + 沉降下落） */
FJ.Engine.prototype._slotTop=function(s){
  if(s.bank) return s.topY;
  let y=0.02+Math.sin(this.time*1.2+s.idx*1.7)*0.028;
  if(s.sinkK>0) y-=0.6*s.sinkK*s.sinkK;
  return y+0.09;
};

/* ================= QTE ================= */
FJ.Engine.prototype._newQte=function(){
  const nxt=this.slots[this.cur+1];
  const n=this.landed;
  const pond=Math.floor(n/C.POND_SIZE);

  const q=this.qte={
    elapsed: U.rand(0, 4),   // 随机起始相位，避免节奏固定
    T: Math.max(C.SWEEP_MIN, C.SWEEP0 - n*C.SWEEP_DECAY - pond*C.SWEEP_POND),
    zc: U.rand(0.24, 0.76),
    zw: 0.3,
    amp: 0, wspeed: 0, ph: U.rand(0,Math.PI*2),
  };
  if(nxt.bank) q.T*=C.BANK_SWEEP;
  q.zw = nxt.bank ? C.BANK_ZONE_W
                  : Math.max(C.ZONE_W_MIN, C.ZONE_W0 - n*C.ZONE_W_DECAY);
  q.zc = U.clamp(q.zc, q.zw/2+0.03, 1-q.zw/2-0.03);
  if(nxt.moving){
    q.amp=U.clamp(C.DRIFT_AMP0 + n*0.0012, 0, C.DRIFT_AMP1);
    q.wspeed=U.rand(C.DRIFT_SPEED0, C.DRIFT_SPEED1);
  }

  const sq=this.store.qte;
  sq.active=true; sq.zoneC=q.zc; sq.zoneW=q.zw; sq.moving=!!nxt.moving;
  sq.result=''; sq.resultText=''; sq.sinkLeft=-1;
};

/* 当前绿区中心（漂移荷叶会缓移） */
FJ.Engine.prototype._zoneC=function(){
  const q=this.qte;
  let c=q.zc;
  if(q.amp>0) c+=Math.sin(q.elapsed*q.wspeed+q.ph)*q.amp;
  return U.clamp(c, q.zw/2+0.02, 1-q.zw/2-0.02);
};

FJ.Engine.prototype._marker=function(){
  return U.tri(this.qte.elapsed/this.qte.T);
};

/* ================= 输入 ================= */
FJ.Engine.prototype._bindInput=function(){
  const canvas=this.renderer.domElement;
  canvas.addEventListener('pointerdown', ()=>this.press());
  window.addEventListener('keydown', (e)=>{
    if(e.code==='Space'||e.code==='Enter'){
      e.preventDefault();
      if(e.repeat) return;
      const s=this.store;
      if(s.screen==='start') FJ.actions.start();
      else if(s.screen==='over') FJ.actions.restart();
      else this.press();
    }
    else if(e.code==='KeyP') FJ.actions.togglePause();
    else if(e.code==='KeyM') FJ.actions.toggleMute();
    else if(e.code==='KeyR' && (this.store.screen==='over'||this.store.screen==='play')){
      if(!this.store.paused) FJ.actions.restart();
    }
  });
};

FJ.Engine.prototype.press=function(){
  const S=this.store;
  if(S.screen!=='play' || S.paused || this.state!=='aim') return;

  const m=this._marker(), c=this._zoneC(), zw=this.qte.zw;
  const dist=Math.abs(m-c);
  const sq=S.qte;
  sq.marker=m; sq.zoneC=c;
  sq.active=false;                      // 定格进度条

  if(dist<=zw/2){
    const perfect = dist<=zw*C.CORE_RATIO/2;
    this._pendingPerfect=perfect;
    S.jumps++;
    if(perfect){
      S.combo++; S.perfects++;
      S.maxCombo=Math.max(S.maxCombo,S.combo);
      sq.result='perfect'; sq.resultText='完美！';
      FJ.audio.perfect(S.combo);
    }else{
      this._comboBreak();
      sq.result='good'; sq.resultText='稳！';
      FJ.audio.land();
    }
    this._doJump(perfect, m, c, zw);
  }else{
    this._comboBreak();
    S.jumps++;
    sq.result='miss'; sq.resultText='落水…';
    this._doFail('miss', m, c);
  }
};

FJ.Engine.prototype._comboBreak=function(){ this.store.combo=0; };

/* ================= 起跳演出 ================= */
FJ.Engine.prototype._doJump=function(perfect, m, c, zw){
  this.state='fly';
  const from=this.frog.group.position.clone();
  const nxt=this.slots[this.cur+1];

  /* 命中偏移 → 3D 落点偏移（完美落正中，"稳"落偏一点，纯演出） */
  const rel=U.clamp((m-c)/(zw/2), -1, 1);
  const offX = nxt.bank ? 0 : rel * nxt.r * 0.42;

  this.fly={
    t:0, T:C.JUMP_T, from,
    to:new THREE.Vector3(nxt.x+offX, nxt.bank?nxt.topY:0.1, nxt.z),
    peak: C.HEIGHT_BASE + Math.min(nxt.x-from.x,3.4)*C.HEIGHT_GAIN*0.4,
    perfect,
  };
  this.frog.startJump(C.JUMP_T);
  this.frog.group.rotation.y=Math.PI/2;
};

/* 落到下一格 */
FJ.Engine.prototype._arrive=function(){
  const S=this.store;
  const slot=this.slots[this.cur+1];
  this.cur++;
  this.landed++;
  S.score=this.landed;
  S.padInPond=this.landed % C.POND_SIZE;
  this._standOffset=this.frog.group.position.x - slot.x;

  const to=this.fly.to;
  this._popup(slot.bank?'上岸！':(this._pendingPerfect?'完美 +1':'+1'),
              this._pendingPerfect?'p-perfect':'p-good', to.x, to.z, to.y+1.1);
  this.frog.onLand(false);
  FJ.pond.ripple(slot.x, slot.z, slot.r*2.2, 0.9);

  if(slot.bank){
    const n=this.landed/C.POND_SIZE;
    FJ.toast(`🏕 渡过第 ${n} 片荷塘！`);
    FJ.audio.milestone();
    FJ.pond.confetti(slot.x, 1.2, slot.z);
    this._applyScene(n+1, true);        // 下一塘：新的季节 / 时辰 / 天气
  }else if(slot.sinking){
    /* 沉降荷叶：限时起跳 */
    this.sinkDeadline=this.time+C.SINK_TIME;
    FJ.toast('⏳ 荷叶正在下沉，快！');
  }

  /* 小飞虫：完美卡点可以吃掉（演出奖励） */
  if(slot.bug){
    if(this._pendingPerfect){
      FJ.audio.gulp();
      this.frog.croak();
      this._popup('呱！吃到了','p-bug', to.x, to.z, to.y+1.9);
    }
    slot.group.remove(slot.bug.sprite);
    slot.bug=null;
  }

  /* 新手引导：第一次成功落地即学会 */
  if(S.tutorial && this.landed===1) FJ.saveTutorialSeen();

  this._ensureSlots();
  this._newQte();
  this.state='aim';
};

/* ================= 落水 ================= */
FJ.Engine.prototype._doFail=function(kind, m, c){
  const S=this.store;
  this.state='fail';
  this._comboBreak();
  FJ.audio.splash();

  const from=this.frog.group.position.clone();
  const nxt=this.slots[this.cur+1];

  if(kind==='miss'){
    /* 手抖：早按 = 跳近落水，晚按 = 跳过头落水 */
    const early = m<c;
    const gapX = (nxt?nxt.x:from.x+2.2) - from.x;
    const lx = early ? from.x + gapX*U.rand(0.3,0.5)
                     : (nxt?nxt.x:from.x+2.5) + U.rand(0.9,1.5);
    this.fail={ t:0, phase:'fly', T:0.5,
      from, to:new THREE.Vector3(lx, 0.02, from.z+(nxt?nxt.z-from.z:0)*0.5) };
    this.frog.startJump(0.5);
    this.frog.group.rotation.y=Math.PI/2;
  }else{
    /* 沉没：被荷叶拖下水 */
    this.fail={ t:0, phase:'sink' };
    FJ.pond.splash(from.x, from.z, 0.8);
    FJ.pond.ripple(from.x, from.z, 2.2, 1.2);
    this.frog.die();
  }
  this.failT=1.5;
  S.qte.result='miss';
  S.qte.resultText = kind==='miss' ? '落水…' : '沉没了…';
  this.shake=0.8;
};

FJ.Engine.prototype._gameOver=function(){
  const S=this.store;
  let tier=C.TIERS[C.TIERS.length-1];
  for(const t of C.TIERS){ if(S.score>=t.min){ tier=t; break; } }
  const isNewBest=S.score>S.best;
  if(isNewBest){ S.best=S.score; FJ.saveBest(S.score); }
  S.over={
    icon:tier.icon, title:tier.title, sub:tier.sub,
    score:S.score, isNewBest,
    maxCombo:S.maxCombo, perfects:S.perfects, jumps:S.jumps,
    ponds:Math.floor(S.score/C.POND_SIZE),
  };
  FJ.audio.gameOver();
  S.screen='over';
};

/* ================= 场景剧本：每渡一塘换一处风景 ================= */
FJ.Engine.prototype._applyScene=function(pondNum, announce){
  const S=this.store;
  const sc=FJ.SCENARIOS[(pondNum-1)%FJ.SCENARIOS.length];
  const ph=FJ.PHASES[sc.time];
  FJ.pond.setPhaseTarget(ph);
  FJ.pond.setSeason(sc.season);
  FJ.pond.setWeather(sc.weather);
  this.weather=sc.weather;
  this._thunderT=U.rand(6,12);
  S.pondIdx=pondNum;
  S.phaseName=ph.name;
  const season=FJ.SEASONS[sc.season];
  const icon = sc.weather==='rain'?'🌧' : sc.weather==='snow'?'❄️' : (ph.key==='night'?'🌙':'☀️');
  S.sceneName=season.name+' · '+ph.name+' '+icon;
  FJ.audio.setNight(ph.key==='night');
  if(announce) setTimeout(()=>FJ.toast(sc.toast), 900);
};

/* ================= 浮动文字 ================= */
FJ.Engine.prototype._popup=function(text, cls, wx, wy, wz_){
  const y = (wz_===undefined) ? 1.4 : wz_;
  const v=new THREE.Vector3(wx, y, wy);
  const s=U.toScreen(v, this.camera);
  FJ.popup(text, cls, s.x, s.y);
};

/* ================= 主循环 ================= */
FJ.Engine.prototype._frame=function(){
  const dt=Math.min(this.clock.getDelta(), 0.05);
  if(!this.store.paused) this._update(dt);
  this.renderer.render(this.scene, this.camera);
};

FJ.Engine.prototype._update=function(dt){
  this.time+=dt;
  const S=this.store;

  FJ.pond.update(dt);
  FJ.pond.applyPhase(dt);
  FJ.pond.setCamX(this.camX);
  /* 太阳随本塘进度起落（夕阳塘跳完正好落山） */
  FJ.pond.setSun(U.clamp((this.landed % C.POND_SIZE)/C.POND_SIZE, 0, 1));

  /* 雷雨：偶尔一道闪电 + 雷声 */
  if(this.weather==='rain' && S.screen==='play' && !S.paused){
    this._thunderT-=dt;
    if(this._thunderT<=0){
      this._thunderT=U.rand(9,17);
      FJ.audio.thunder();
      const el=document.getElementById('fx-flash');
      if(el){ el.classList.add('on'); setTimeout(()=>el.classList.remove('on'), 130); }
    }
  }

  /* ---- 站点：浮沉 / 漂移 / 沉降 ---- */
  for(let i=0;i<this.spawned;i++){
    const s=this.slots[i];
    if(!s || s.bank) continue;
    if(s.moving) s.z=s.baseZ+Math.sin(this.time*s.spd+s.ph)*s.ampZ;
    if(s.sinkK>0){
      s.leaf.rotation.x=Math.sin(this.time*14)*0.12*s.sinkK;
      if(Math.random()<dt*5) FJ.pond.ripple(s.x+U.rand(-0.3,0.3), s.z+U.rand(-0.3,0.3), 1.1, 0.7);
    }
    s.group.position.set(s.x, this._slotTop(s)-0.09, s.z);
    if(s.tilt>0){
      s.tilt=Math.max(0,s.tilt-dt*1.4);
      s.leaf.rotation.z=Math.cos(this.time*13)*0.13*s.tilt;
    }
    if(s.bug){
      const t=this.time*2.2+s.bug.ph;
      s.bug.sprite.position.set(Math.cos(t)*0.22, 0.95+Math.sin(t*1.7)*0.12, Math.sin(t)*0.22);
    }
  }

  /* 沉降压力：站在沉降荷叶上时 sinkK 随倒计时增长 */
  const stand=this.slots[this.cur];
  if(stand && !stand.bank && stand.sinking && this.sinkDeadline>0 && this.state==='aim'){
    stand.sinkK=U.clamp(1-(this.sinkDeadline-this.time)/C.SINK_TIME, 0, 1);
  }

  /* ---- 状态机 ---- */
  if(this.state==='aim'){
    const q=this.qte;
    q.elapsed+=dt;
    const sq=S.qte;
    sq.marker=this._marker();
    sq.zoneC=this._zoneC();
    sq.sinkLeft = this.sinkDeadline>0
      ? U.clamp((this.sinkDeadline-this.time)/C.SINK_TIME, 0, 1) : -1;
    if(this.sinkDeadline>0 && this.time>=this.sinkDeadline){
      this.sinkDeadline=-1;
      this._doFail('drown');
    }
    /* 青蛙随荷叶浮沉/漂移 */
    if(stand){
      this.frog.group.position.set(
        stand.x+this._standOffset, this._slotTop(stand), stand.z
      );
    }
    this._idleCroak-=dt;
    if(this._idleCroak<=0){
      this._idleCroak=U.rand(5,10);
      this.frog.croak();
      FJ.audio.croak(U.rand(0.85,1.2));
    }
  }
  else if(this.state==='fly'){
    const f=this.fly;
    f.t+=dt;
    const k=U.clamp(f.t/f.T,0,1);
    const x=U.lerp(f.from.x, f.to.x, k);
    const z=U.lerp(f.from.z, f.to.z, k);
    const y=U.lerp(f.from.y, f.to.y, k) + f.peak*Math.sin(Math.PI*k);
    this.frog.group.position.set(x,y,z);
    this.frog.setAir(k);
    if(k>=1){ this.sinkDeadline=-1; this._arrive(); }
  }
  else if(this.state==='fail'){
    const f=this.fail;
    f.t+=dt;
    if(f.phase==='fly'){
      const k=U.clamp(f.t/0.5,0,1);
      const x=U.lerp(f.from.x, f.to.x, k);
      const z=U.lerp(f.from.z, f.to.z, k);
      const y=U.lerp(f.from.y, 0.02, k) + 0.9*Math.sin(Math.PI*k);
      this.frog.group.position.set(x,y,z);
      this.frog.setAir(k);
      if(k>=1){
        f.phase='sink';
        FJ.pond.splash(f.to.x, f.to.z, 1.15);
        FJ.pond.ripple(f.to.x, f.to.z, 3.0, 1.4);
        this.frog.die();
        this.frog.pose.air=-1;
      }
    }else{
      /* 落水后缓缓下沉 */
      const d=this.frog.group.position;
      d.y=U.damp(d.y, -0.85, 2.4, dt);
    }
  }

  this.frog.update(dt, this.time);

  /* ---- 伪阴影 ---- */
  const fg=this.frog.group.position;
  const h=Math.max(0, fg.y);
  this.shadow.visible=!this.frog.pose.dead;
  this.shadow.position.set(fg.x, 0.045, fg.z);
  const sc=0.9+h*0.12;
  this.shadow.scale.set(sc, sc, 1);
  this.shadow.material.opacity=U.clamp(0.34-h*0.09, 0.08, 0.34);

  /* ---- 镜头（侧面横移跟随） ---- */
  this._updateCamera(dt);

  /* ---- 落水 → 结算 ---- */
  if(this.failT>0){
    this.failT-=dt;
    if(this.failT<=0){ this.failT=-1; this._gameOver(); }
  }
};

FJ.Engine.prototype._updateCamera=function(dt){
  const S=this.store;
  const fg=this.frog.group.position;
  this.camX=U.damp(this.camX, fg.x, C.CAM_LERP, dt);

  if(S.screen==='play'){
    this.camera.position.set(
      this.camX+C.CAM_OFF_X, C.CAM_Y, C.CAM_Z
    );
    if(this.shake>0){
      this.shake=Math.max(0,this.shake-dt*2.0);
      this.camera.position.y+=U.rand(-1,1)*0.12*this.shake;
      this.camera.position.x+=U.rand(-1,1)*0.1*this.shake;
    }
    this.camera.lookAt(this.camX+C.CAM_OFF_X, C.CAM_LOOK_Y, 0);
  }else{
    /* 首页/结算：稍高稍远，缓慢横摇 */
    const sway=Math.sin(this.time*0.25)*1.6;
    this.camera.position.set(
      this.camX+C.CAM_OFF_X+sway, C.CAM_Y+1.6, C.CAM_Z+2.2
    );
    this.camera.lookAt(this.camX+C.CAM_OFF_X, C.CAM_LOOK_Y+0.2, 0);
  }
};

FJ.Engine.prototype._resize=function(){
  const w=window.innerWidth, h=window.innerHeight;
  this.camera.aspect=w/h;
  this.camera.updateProjectionMatrix();
  this.renderer.setSize(w, h);
};
})();
</script>
<script>
/* ============================================================
   ui.js — Vue 界面层（开始页 / HUD+QTE进度条 / 结算 / 引导）
   引擎写 store → 这里自动渲染；按钮/键盘 → 调 FJ.actions
   ============================================================ */
(function(){
const FJ = window.FJ = window.FJ || {};

FJ.mountUI = function(el){
  const app = Vue.createApp({
    data(){ return { s: FJ.store }; },
    computed:{
      /* QTE 进度条各元素的内联样式 */
      zoneStyle(){
        const q=this.s.qte;
        const left=Math.max(0,(q.zoneC-q.zoneW/2))*100;
        const w=Math.min(q.zoneW,100-left)*100;
        return { left:left+'%', width:w+'%' };
      },
      coreStyle(){
        const q=this.s.qte;
        const cw=q.zoneW*0.36*100;
        return { width:cw+'%', left:(q.zoneC*100-cw/2)+'%' };
      },
      markerStyle(){
        return { left:(this.s.qte.marker*100)+'%' };
      },
      sinkStyle(){
        return { width:Math.max(0,this.s.qte.sinkLeft*100)+'%' };
      },
      /* 荷塘进度点（10 格一塘） */
      pondDots(){
        const n=10, cur=this.s.padInPond;
        return Array.from({length:n},(_,i)=>({i, done:i<cur, next:i===cur}));
      },
      tierHint(){
        const b=this.s.best;
        if(b>=50) return '👑 传奇蛙皇，还能更远吗？';
        if(b>=30) return '距离「跳格大师」只差几格';
        if(b>=20) return '冲击 30 格解锁「跳格大师」';
        if(b>=12) return '冲击 20 格解锁「荷塘健将」';
        if(b>=6)  return '冲击 12 格解锁「小有身手」';
        return '先跳过 6 格，证明你是青蛙不是蝌蚪';
      },
    },
    template:`
<div>
  <!-- ============ 加载页 ============ -->
  <div v-if="s.screen==='loading'" class="loading">
    <div class="loading-frog">🐸</div>
    <div class="loading-text">荷塘加载中…</div>
  </div>

  <!-- ============ 开始页 ============ -->
  <div v-else-if="s.screen==='start'" class="start">
    <div class="start-card panel">
      <div class="start-frog">🐸</div>
      <h1 class="start-title">青蛙跳格</h1>
      <p class="start-sub">正午的荷塘拦住了去路<br>踩着荷叶跳过去 · 小心别落水</p>

      <div class="start-best" v-if="s.best>0">
        🏆 最佳战绩 <b>{{s.best}}</b> 格
      </div>
      <div class="start-best start-best-empty" v-else>
        🌱 还没有战绩，第一跳就在今天
      </div>

      <button class="btn-primary" @click="FJ.actions.start()">
        开 始 挑 战 <span class="kbd">Space</span>
      </button>
      <div class="start-hint">{{tierHint}}</div>

      <div class="howto">
        <div class="how-item"><span class="hi">🎯</span>光标来回飞驰，按<b class="kbd">空格</b>卡进绿区</div>
        <div class="how-item"><span class="hi">⭐</span>卡进金色正中 = 完美连击</div>
        <div class="how-item"><span class="hi">💧</span>手一抖落水 → 重头再来</div>
      </div>
      <div class="start-tiny">四季晨昏 · 晴雨飞雪 · 每渡一片荷塘都是新的风景 · PC 键盘体验最佳</div>
    </div>
  </div>

  <!-- ============ 游戏 HUD ============ -->
  <div v-else-if="s.screen==='play'">
    <!-- 分数 -->
    <div class="hud-score panel">
      <div class="score-num">{{s.score}}</div>
      <div class="score-label">格</div>
    </div>

    <!-- 连击 -->
    <div v-if="s.combo>=2" class="combo-badge" :key="s.combo">
      🔥 完美连击 ×{{s.combo}}
    </div>

    <!-- 荷塘进度点 -->
    <div class="pond-progress">
      <span class="pp-label">第{{s.pondIdx}}塘</span>
      <span v-for="d in pondDots" :key="d.i" class="pp-dot"
            :class="{done:d.done, next:d.next}"></span>
    </div>

    <!-- 右上控制 -->
    <div class="hud-ctrl">
      <button class="ctrl" title="音效 (M)" @click="FJ.actions.toggleMute()">{{ s.muted ? '🔇' : '🔊' }}</button>
      <button class="ctrl" title="暂停 (P)" @click="FJ.actions.togglePause()">⏸</button>
    </div>

    <!-- 风景角标：季节 · 时辰 · 天气 -->
    <div class="phase-tag scene-tag">{{s.sceneName}}</div>

    <!-- ======== QTE 进度条（核心玩法区） ======== -->
    <div class="qte-wrap" :class="{dim:!s.qte.active, rPerfect:s.qte.result==='perfect', rGood:s.qte.result==='good', rMiss:s.qte.result==='miss'}">
      <!-- 沉降倒计时 -->
      <div v-if="s.qte.sinkLeft>=0" class="sink-timer">
        <div class="sink-label">⏳ 荷叶正在下沉！</div>
        <div class="sink-bar"><i :style="sinkStyle"></i></div>
      </div>
      <!-- 命中结果 -->
      <div v-if="s.qte.result && !s.qte.active" class="qte-result" :class="'qr-'+s.qte.result">{{s.qte.resultText}}</div>
      <!-- 进度条 -->
      <div class="qte-bar">
        <div class="qte-zone" :style="zoneStyle"></div>
        <div class="qte-core" :style="coreStyle"></div>
        <div class="qte-marker" :style="markerStyle"></div>
      </div>
      <div class="qte-hint">
        <span v-if="s.qte.active">按 <b class="kbd">空格</b> 卡进绿区起跳</span>
        <span v-else-if="s.qte.result==='miss'">呱哇——</span>
        <span v-else>　</span>
      </div>
    </div>

    <!-- 新手引导 -->
    <div v-if="s.tutorial" class="tutorial">
      <div class="tut-key"><span class="kbd big">空格</span></div>
      <div class="tut-main">光标扫到绿区时按下空格</div>
      <div class="tut-sub">卡得越正中，落点越漂亮 · 金色正中是"完美"· 卡偏了会落水重来</div>
    </div>

    <!-- 浮动文字 -->
    <div v-for="p in s.popups" :key="p.id" class="popup" :class="p.cls"
         :style="{left:p.x+'%', top:p.y+'%'}">{{p.text}}</div>

    <!-- 吐司 -->
    <div class="toasts">
      <div v-for="t in s.toasts" :key="t.id" class="toast">{{t.text}}</div>
    </div>

    <!-- 暂停弹窗 -->
    <div v-if="s.paused" class="modal-mask">
      <div class="modal pause-modal">
        <div class="pause-title">⏸ 歇一会儿</div>
        <p class="pause-sub">光标停了，荷叶还在漂。</p>
        <button class="btn-primary" @click="FJ.actions.togglePause()">继 续 <span class="kbd">P</span></button>
        <div class="pause-row">
          <button class="btn-ghost" @click="FJ.actions.toggleMute()">{{ s.muted ? '🔇 音效关' : '🔊 音效开' }}</button>
          <button class="btn-ghost" @click="FJ.actions.restart()">🔄 重新开始</button>
          <button class="btn-ghost" @click="FJ.actions.home()">🏠 回首页</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 结算页 ============ -->
  <div v-else-if="s.screen==='over' && s.over" class="over-wrap">
    <div class="modal over-modal">
      <div class="over-new" v-if="s.over.isNewBest">✨ 新纪录！</div>
      <div class="over-icon">{{s.over.icon}}</div>
      <div class="over-title">{{s.over.title}}</div>
      <div class="over-sub">{{s.over.sub}}</div>
      <div class="over-score">
        <span class="os-num">{{s.over.score}}</span><span class="os-unit">格</span>
      </div>
      <div class="over-best">🏆 历史最佳 {{s.best}} 格 · 渡过 {{s.over.ponds}} 片荷塘</div>
      <div class="over-stats">
        <div class="ost"><b>{{s.over.maxCombo}}</b><span>最高连击</span></div>
        <div class="ost"><b>{{s.over.perfects}}</b><span>完美卡点</span></div>
        <div class="ost"><b>{{s.over.jumps}}</b><span>按空格次数</span></div>
      </div>
      <button class="btn-primary" @click="FJ.actions.restart()">再 来 一 次 <span class="kbd">Space</span></button>
      <button class="btn-ghost over-home" @click="FJ.actions.home()">🏠 回到首页</button>
    </div>
  </div>
</div>
`,
  });
  app.config.globalProperties.FJ = FJ;
  app.mount(el);
};
})();
</script>
<script>
/* ============================================================
   main.js — 启动引导
   ============================================================ */
(function(){
let _booted=false;
function boot(){
  if(_booted) return;
  _booted=true;
  const FJ=window.FJ;
  if(!window.THREE || !window.Vue){
    FJ.store.screen='loading';
    document.querySelector('.loading-text').textContent='依赖库加载失败，请检查网络后刷新页面';
    return;
  }
  try{
    FJ.game = new FJ.Engine(document.getElementById('scene'));
    FJ.mountUI(document.getElementById('app'));
    FJ.store.screen='start';
  }catch(e){
    console.error(e);
    FJ.store.screen='loading';
    const el=document.querySelector('.loading-text');
    if(el) el.textContent='初始化失败：' + (e && e.message || e);
  }
}
function waitDeps(){
  if(window.THREE && window.Vue) boot();
  else{
    let n=0;
    const timer=setInterval(()=>{
      n++;
      if((window.THREE && window.Vue) || n>40){ clearInterval(timer); boot(); }
    },250);
  }
}
window.addEventListener('DOMContentLoaded', waitDeps);
if(document.readyState!=='loading') waitDeps();
})();
</script>
</body>
</html>
