<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c221d">
<title>青蛙跳格 · 正午渡塘</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>">
<style>
/* ============================================================
   青蛙跳格 · 正午渡塘 — 全站样式（PC 键盘体验为主）
   ============================================================ */
:root{
  --gold:#ffd76a; --gold2:#ffb84d;
  --frog:#7be0ad; --frog2:#4fae5c;
  --ink:#ecf7ef; --ink-dim:rgba(236,247,239,.62);
  --glass:rgba(8,26,20,.55); --glass2:rgba(8,26,20,.82);
  --line:rgba(255,255,255,.14);
  --radius:16px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0c221d;font-family:var(--font);color:var(--ink)}
[v-cloak]{display:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#app{position:fixed;inset:0;pointer-events:none;z-index:10}
#app button{pointer-events:auto;font-family:var(--font)}

.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:5}
#fx-vignette{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,10,6,.5) 100%);z-index:4}
/* 雷雨闪电 */
#fx-flash{background:#eaf2ff;opacity:0;transition:opacity .55s;z-index:6}
#fx-flash.on{opacity:.5;transition:opacity .04s}

/* 风景角标（季节 · 时辰 · 天气） */
.scene-tag{letter-spacing:1.5px}

.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,10,5,.35)}

/* 键帽样式 */
.kbd{
  display:inline-block;padding:2px 9px;margin:0 3px;border-radius:7px;
  font-size:11px;font-weight:800;letter-spacing:1px;color:#173425;
  background:linear-gradient(180deg,#fff,#d8e6da);
  border:1px solid rgba(255,255,255,.7);border-bottom-width:3px;
  box-shadow:0 2px 6px rgba(0,10,5,.35);vertical-align:middle;
}
.kbd.big{font-size:15px;padding:5px 18px;border-radius:10px;border-bottom-width:4px}

/* ---------------- 按钮 ---------------- */
.btn-primary{
  width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
  font-size:18px;font-weight:800;letter-spacing:4px;color:#173425;
  background:linear-gradient(120deg,var(--frog),var(--gold));
  box-shadow:0 6px 22px rgba(123,224,173,.35);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{
  flex:1;padding:10px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;
  color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);transition:.18s;
}
.btn-ghost:hover{background:rgba(255,215,106,.14);border-color:rgba(255,215,106,.4)}

/* ---------------- 加载页 ---------------- */
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.loading-frog{font-size:64px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.loading-text{font-size:14px;letter-spacing:4px;color:var(--ink-dim)}

/* ---------------- 开始页 ---------------- */
.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
.start-card{
  width:min(460px,100%);padding:32px 30px 22px;text-align:center;
  animation:popIn .5s cubic-bezier(.2,1.4,.4,1);
}
@keyframes popIn{from{transform:scale(.86) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.start-frog{font-size:60px;line-height:1;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4));animation:bob 2s ease-in-out infinite}
.start-title{
  margin-top:8px;font-size:40px;font-weight:900;letter-spacing:10px;
  background:linear-gradient(120deg,var(--frog),#fff,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px rgba(123,224,173,.3));
}
.start-sub{margin-top:10px;font-size:13.5px;line-height:1.8;letter-spacing:2px;color:var(--ink-dim)}
.start-best{
  margin:16px auto 0;display:inline-block;padding:7px 18px;border-radius:20px;
  font-size:13.5px;background:rgba(255,215,106,.12);border:1px solid rgba(255,215,106,.3);color:var(--gold);
}
.start-best b{font-size:16px;margin:0 2px}
.start-best-empty{color:var(--ink-dim);background:rgba(255,255,255,.06);border-color:var(--line)}
.start-card .btn-primary{margin-top:18px}
.start-hint{margin-top:12px;font-size:12px;color:var(--ink-dim)}
.howto{margin-top:16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.how-item{font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:6px}
.how-item .hi{font-size:15px}
.start-tiny{margin-top:14px;font-size:10.5px;color:var(--ink-dim);letter-spacing:1px}

/* ---------------- HUD：分数 ---------------- */
.hud-score{
  position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;align-items:baseline;gap:5px;padding:8px 22px 10px;
}
.score-num{
  font-size:38px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(160deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.score-label{font-size:12px;color:var(--ink-dim)}

.combo-badge{
  position:absolute;top:calc(78px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  padding:5px 16px;border-radius:20px;font-size:13px;font-weight:800;color:#ff9c4d;
  background:rgba(80,30,0,.5);border:1px solid rgba(255,156,77,.45);
  animation:comboPop .3s cubic-bezier(.2,1.6,.4,1);
}
@keyframes comboPop{from{transform:translateX(-50%) scale(1.5)}to{transform:translateX(-50%) scale(1)}}

.phase-tag{
  position:absolute;top:calc(18px + env(safe-area-inset-top));left:14px;
  padding:5px 12px;border-radius:14px;font-size:11.5px;letter-spacing:2px;color:var(--ink-dim);
  background:var(--glass);border:1px solid var(--line);
}

/* 荷塘进度点 */
.pond-progress{
  position:absolute;top:calc(22px + env(safe-area-inset-top));left:14px;
  display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:14px;
  background:var(--glass);border:1px solid var(--line);
}
.pp-label{font-size:11px;color:var(--ink-dim);margin-right:3px;letter-spacing:1px}
.pp-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16);transition:.25s}
.pp-dot.done{background:var(--frog);box-shadow:0 0 7px rgba(123,224,173,.7)}
.pp-dot.next{background:rgba(255,215,106,.5);animation:dotPulse 1s ease-in-out infinite}
@keyframes dotPulse{50%{transform:scale(1.35)}}

.hud-ctrl{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;display:flex;gap:8px}
.ctrl{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);cursor:pointer;
  background:var(--glass);backdrop-filter:blur(8px);color:var(--ink);font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.ctrl:active{transform:scale(.9)}

/* ---------------- QTE 进度条（核心） ---------------- */
.qte-wrap{
  position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(460px, 86vw);display:flex;flex-direction:column;align-items:center;gap:9px;
  transition:opacity .18s;
}
.qte-wrap.dim{opacity:.42}
.qte-bar{
  width:100%;height:30px;border-radius:16px;position:relative;overflow:hidden;
  background:rgba(0,0,0,.44);border:1px solid rgba(255,255,255,.2);
  box-shadow:0 6px 24px rgba(0,10,5,.45), 0 0 0 1px rgba(0,0,0,.3) inset;
}
/* 危险区斜纹底 */
.qte-bar::before{
  content:'';position:absolute;inset:0;opacity:.16;
  background:repeating-linear-gradient(115deg,transparent 0 10px,rgba(255,255,255,.5) 10px 12px);
}
.qte-zone{
  position:absolute;top:0;bottom:0;
  background:linear-gradient(180deg,rgba(123,224,173,.5),rgba(123,224,173,.28));
  border-left:1px solid rgba(123,224,173,.8);border-right:1px solid rgba(123,224,173,.8);
  box-shadow:0 0 16px rgba(123,224,173,.45) inset;
  transition:left .05s linear;
}
.qte-core{
  position:absolute;top:0;bottom:0;
  background:linear-gradient(180deg,rgba(255,215,106,.95),rgba(255,184,77,.75));
  box-shadow:0 0 18px rgba(255,215,106,.9);
  transition:left .05s linear;
}
.qte-marker{
  position:absolute;top:-4px;bottom:-4px;width:6px;border-radius:3px;
  background:#fff;box-shadow:0 0 14px #fff,0 0 30px rgba(255,255,255,.6);
  transform:translateX(-50%);
}
/* 命中结果反馈 */
.qte-result{
  font-size:24px;font-weight:900;letter-spacing:5px;
  animation:zoomIn .3s cubic-bezier(.2,1.5,.4,1);
}
@keyframes zoomIn{from{transform:scale(1.9);opacity:0}to{transform:scale(1);opacity:1}}
.qr-perfect{color:var(--gold);text-shadow:0 0 22px rgba(255,215,106,.9)}
.qr-good{color:var(--frog);text-shadow:0 0 16px rgba(123,224,173,.7)}
.qr-miss{color:#ff8f8f;text-shadow:0 0 16px rgba(255,100,100,.6)}
/* 命中时整条进度条闪色 */
.qte-wrap.rPerfect .qte-bar{box-shadow:0 0 26px rgba(255,215,106,.75)}
.qte-wrap.rGood .qte-bar{box-shadow:0 0 20px rgba(123,224,173,.6)}
.qte-wrap.rMiss .qte-bar{box-shadow:0 0 22px rgba(255,90,90,.6);border-color:rgba(255,120,120,.6)}
.qte-hint{font-size:11.5px;letter-spacing:2px;color:var(--ink-dim);min-height:16px}

/* 沉降倒计时 */
.sink-timer{width:78%;display:flex;flex-direction:column;gap:4px;align-items:center}
.sink-label{font-size:11.5px;font-weight:800;color:#ff9c6b;letter-spacing:2px;animation:blinkWarn .5s step-end infinite}
@keyframes blinkWarn{50%{opacity:.35}}
.sink-bar{width:100%;height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
.sink-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ff9c6b,#ff5f5f);box-shadow:0 0 10px rgba(255,110,90,.8)}

/* ---------------- 新手引导 ---------------- */
.tutorial{
  position:absolute;left:50%;top:34%;transform:translateX(-50%);
  width:min(360px,86vw);text-align:center;pointer-events:none;
  animation:tutFloat 2s ease-in-out infinite;
}
@keyframes tutFloat{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}
.tut-key{margin-bottom:10px}
.tut-main{font-size:18px;font-weight:800;letter-spacing:2px;text-shadow:0 2px 14px rgba(0,0,0,.75)}
.tut-sub{margin-top:9px;font-size:12px;line-height:1.8;color:var(--ink);text-shadow:0 2px 10px rgba(0,0,0,.8);background:rgba(8,26,20,.5);border-radius:12px;padding:8px 12px;display:inline-block}

/* ---------------- 浮动文字 ---------------- */
.popup{
  position:absolute;transform:translate(-50%,-50%);pointer-events:none;
  font-size:22px;font-weight:900;letter-spacing:2px;white-space:nowrap;
  animation:popupFloat .95s ease-out forwards;
}
@keyframes popupFloat{
  0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-160%) scale(1)}
}
.p-perfect{color:var(--gold);text-shadow:0 0 18px rgba(255,215,106,.9),0 2px 6px rgba(0,0,0,.5)}
.p-good{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.5)}
.p-bug{color:#c8f7ff;font-size:17px;text-shadow:0 0 12px rgba(120,220,255,.8),0 2px 6px rgba(0,0,0,.5)}

/* ---------------- 吐司 ---------------- */
.toasts{
  position:absolute;top:calc(120px + env(safe-area-inset-top));left:0;right:0;
  display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;
}
.toast{
  padding:8px 20px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:1px;
  background:var(--glass2);border:1px solid rgba(255,215,106,.35);color:var(--gold);
  animation:toastIn .35s, toastOut .5s 2s forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}

/* ---------------- 弹窗 ---------------- */
.modal-mask,.over-wrap{
  position:absolute;inset:0;background:rgba(2,10,6,.5);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:18px;pointer-events:auto;
  animation:fadeIn .3s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:min(420px,100%);text-align:center;
  background:linear-gradient(160deg,rgba(14,40,30,.94),rgba(7,22,17,.96));
  border:1px solid rgba(123,224,173,.25);border-radius:22px;padding:26px 24px;
  box-shadow:0 20px 60px rgba(0,10,5,.6);
  animation:popIn .38s cubic-bezier(.2,1.4,.4,1);
}

/* 暂停 */
.pause-title{font-size:22px;font-weight:900;letter-spacing:4px}
.pause-sub{margin:8px 0 18px;font-size:12.5px;color:var(--ink-dim)}
.pause-row{display:flex;gap:9px;margin-top:12px}

/* 结算 */
.over-modal{position:relative}
.over-new{
  position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  padding:5px 18px;border-radius:18px;font-size:13px;font-weight:900;letter-spacing:2px;color:#173425;
  background:linear-gradient(120deg,var(--gold),var(--gold2));box-shadow:0 4px 16px rgba(255,184,77,.5);
  animation:comboPop .4s cubic-bezier(.2,1.6,.4,1);
}
.over-icon{font-size:56px;line-height:1;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
.over-title{margin-top:10px;font-size:26px;font-weight:900;letter-spacing:6px;
  background:linear-gradient(120deg,var(--frog),#fff,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.over-sub{margin-top:6px;font-size:12.5px;color:var(--ink-dim)}
.over-score{margin-top:14px;display:flex;align-items:baseline;justify-content:center;gap:6px}
.os-num{
  font-size:58px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(160deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.os-unit{font-size:14px;color:var(--ink-dim)}
.over-best{margin-top:8px;font-size:12.5px;color:var(--gold)}
.over-stats{display:flex;justify-content:center;gap:10px;margin:18px 0 4px}
.ost{
  flex:1;padding:11px 6px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);
}
.ost b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.ost span{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-dim)}
.over-modal .btn-primary{margin-top:16px}
.over-home{margin-top:10px;width:100%}

/* ---------------- 移动端适配 ---------------- */
@media (max-width:560px){
  .start-title{font-size:32px;letter-spacing:7px}
  .score-num{font-size:30px}
  .start-card{padding:26px 20px 18px}
  .pp-dot{width:7px;height:7px}
  .pond-progress{gap:4px;padding:6px 9px}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<!-- 全屏氛围层（暗角 / 雷雨闪电） -->
<div id="fx-vignette" class="fx-layer"></div>
<div id="fx-flash" class="fx-layer"></div>

<!-- Vue UI 挂载点 -->
<div id="app" v-cloak></div>

<!-- 全局错误捕获（便于调试） -->
<script>
window.__errs=[];
window.addEventListener('error',e=>{ window.__errs.push(String(e.message||e)); });
window.addEventListener('unhandledrejection',e=>{ window.__errs.push('rejection: '+String(e.reason||e)); });
</script>

<!-- 依赖（CDN + 备用源回退） -->
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.27/dist/vue.global.prod.js"></script>
<script>window.Vue || document.write('<script src="https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://unpkg.com/three@0.149.0/build/three.min.js"><\/script>')</script>

<!-- 游戏代码（全局命名空间 FJ，按依赖顺序内联） -->
<script>
/* ============================================================
   config.js — 全部数值调参入口（改手感只动这里）
   玩法：QTE 卡点跳格——光标快速扫过进度条，按【空格】卡进
   绿区 = 起跳一格；卡进金色正中 = 完美；卡偏 = 落水重来。
   ============================================================ */
(function(){
const FJ = window.FJ = window.FJ || {};

FJ.CFG = {
  /* ---------- QTE 手感 ---------- */
  SWEEP0      : 1.05,   // 初始光标单程扫动耗时（秒），越小越快
  SWEEP_MIN   : 0.55,   // 光速上限
  SWEEP_DECAY : 0.016,  // 每跳 1 格光标加速量
  SWEEP_POND  : 0.02,   // 每渡过一片荷塘额外加速量
  ZONE_W0     : 0.30,   // 初始绿区宽度（占进度条比例）
  ZONE_W_MIN  : 0.11,   // 绿区宽度下限
  ZONE_W_DECAY: 0.005,  // 每格绿区缩窄量
  CORE_RATIO  : 0.36,   // 金色"完美正中"占绿区的比例
  BANK_ZONE_W : 0.42,   // 上岸（堤岸）时的绿区宽度——奖励关
  BANK_SWEEP  : 1.18,   // 上岸时光标放慢倍率

  /* ---------- 特殊荷叶 ---------- */
  DRIFT_FROM  : 8,      // 第 N 格起出现"漂移荷叶"（绿区左右缓移 + 荷叶漂移）
  DRIFT_CHANCE: 0.30,
  DRIFT_AMP0  : 0.05,   // 绿区漂移幅度（占进度条比例，前期）
  DRIFT_AMP1  : 0.11,   // 后期
  DRIFT_SPEED0: 0.8,    // 漂移角速度范围
  DRIFT_SPEED1: 1.5,
  SINK_FROM   : 14,     // 第 N 格起出现"沉降荷叶"（踩上后限时起跳）
  SINK_CHANCE : 0.22,
  SINK_TIME   : 3.4,    // 沉没倒计时（秒）——倒计时内没卡中 = 落水

  /* ---------- 荷塘结构 ---------- */
  POND_SIZE   : 10,     // 每片荷塘 10 格，第 10 格是堤岸（渡塘庆祝）
  GAP_MIN     : 1.7,    // 荷叶间距（3D 演出用）
  GAP_MAX0    : 2.6,
  GAP_MAX1    : 3.4,
  GAP_RAMP    : 30,
  PAD_R_MAX   : 1.22,   // 荷叶半径（3D 演出用，随进度缩小）
  PAD_R_MIN   : 0.85,
  PAD_SHRINK  : 0.012,

  /* ---------- 跳跃演出 ---------- */
  JUMP_T      : 0.55,   // 每次腾空时长（秒）
  HEIGHT_BASE : 0.85,
  HEIGHT_GAIN : 0.4,

  /* ---------- 镜头（侧面视角，微仰可见天空日月） ---------- */
  CAM_OFF_X   : 2.2,
  CAM_Y       : 6.8,
  CAM_Z       : 13.0,
  CAM_LOOK_Y  : 3.0,
  CAM_LERP    : 4.5,

  /* ---------- 结算称号（按跳过格数） ---------- */
  TIERS: [
    { min:50, icon:'👑', title:'传奇蛙皇', sub:'荷塘传说，一跳封神！' },
    { min:30, icon:'🥇', title:'跳格大师', sub:'光标就是你的节拍器。' },
    { min:20, icon:'🥈', title:'荷塘健将', sub:'这片荷塘已经拦不住你了。' },
    { min:12, icon:'🥉', title:'小有身手', sub:'小伙伴都在问你练了多久。' },
    { min:6,  icon:'🌱', title:'初出茅庐', sub:'节奏已经摸到一点了，继续！' },
    { min:0,  icon:'💧', title:'落水新手', sub:'看准绿区再出手，别急着按。' },
  ],
};

<script>
/* ============================================================
   utils.js — 数学/随机/画布纹理工具
   ============================================================ */
(function(){
const FJ = window.FJ = window.FJ || {};

const U = FJ.utils = {};

U.clamp = (v,a,b)=> v<a?a:(v>b?b:v);
U.lerp  = (a,b,t)=> a+(b-a)*t;
/* 帧率无关阻尼 */
U.damp  = (a,b,l,dt)=> U.lerp(a,b,1-Math.exp(-l*dt));
/* 颜色阻尼（THREE.Color） */
U.dampColor = (c, target, l, dt)=>{ c.r=U.damp(c.r,target.r,l,dt); c.g=U.damp(c.g,target.g,l,dt); c.b=U.damp(c.b,target.b,l,dt); };
U.rand  = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
U.pick  = arr => arr[Math.floor(Math.random()*arr.length)];
/* 三角波 0..1..0（QTE 光标扫动） */
U.tri   = t => { const m=t%2; return m<1?m:2-m; };

function makeCanvas(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  return [c, c.getContext('2d')];
}

/* 柔和圆点（水花/萤火/星光通用粒子贴图） */
U.softDot = function(color, size=64, inner=0.3){
  const [c,x]=makeCanvas(size,size);
  const g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0, color); g.addColorStop(inner, color);
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
};

/* 光晕（月亮/太阳） */
U.glowTex = function(color='rgba(255,246,200,1)'){
  const s=128,[c,x]=makeCanvas(s,s);
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.3, color);
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
};

/* 堤岸小路纹理：土路 + 中央浅纹 */
U.pathTex = function(){
  const w=256,h=256,[c,x]=makeCanvas(w,h);
  x.fillStyle='#c9b184'; x.fillRect(0,0,w,h);
  for(let i=0;i<600;i++){
    const g=170+Math.random()*50|0;
    x.fillStyle=`rgba(${g},${g-30},${g-70},${0.12+Math.random()*0.2})`;
    x.fillRect(Math.random()*w, Math.random()*h, 3, 3);
  }
  x.fillStyle='rgba(140,110,70,.35)';
  for(let y=20;y<h;y+=46) x.fillRect(w/2-4, y, 8, 22);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=THREE.RepeatWrapping; t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=4;
  return t;
};

/* emoji 精灵（飞虫/装饰） */
U.emojiSprite = function(ch, size=1){
  const s=128,[c,x]=makeCanvas(s,s);
  x.font='96px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText(ch, s/2, s/2+8);
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  sp.scale.set(size,size,1);
  return sp;
};

/* 3D 世界坐标 → 屏幕百分比坐标（浮动文字用） */
U.toScreen = function(v3, camera){
  const v = v3.clone ? v3.clone() : new THREE.Vector3(v3.x,v3.y,v3.z);
  v.project(camera);
  return {
    x: U.clamp(( v.x*0.5+0.5)*100, -20, 120),
    y: U.clamp((-v.y*0.5+0.5)*100, -20, 120),
  };
};

/* 安全 dispose 一棵对象树 */
U.disposeGroup = function(g){
  g.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){ const ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); }); }
  });
};
})();
</script>
<script>
/* ============================================================
   audio.js — WebAudio 合成音效（零素材：全部程序化生成）
   蛙鸣 / 蓄力音 / 起跳风声 / 落水 / 连击音阶 / 虫鸣氛围
   ============================================================ */
(function(){
const FJ = window.FJ = window.FJ || {};

const A = FJ.audio = {
  ctx:null, master:null, muted:false,
  _noise:null,
  _charge:null, _chargeGain:null,
  _ambient:null, _ambientGain:null,
  _cricketTimer:null,

  /* 必须由用户手势触发（开始按钮） */
  ensure(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted?0:0.55;
      this.master.connect(this.ctx.destination);
      this._noise = this._makeNoise(2);
    }catch(e){ this.ctx=null; }
  },

  setMuted(m){
    this.muted=m;
    if(this.master) this.master.gain.value = m?0:0.55;
    try{ localStorage.setItem('fj_muted', m?'1':'0'); }catch(e){}
  },

  _makeNoise(sec){
    const rate=this.ctx.sampleRate, len=rate*sec;
    const buf=this.ctx.createBuffer(1,len,rate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    return buf;
  },

  /* 基础音符 */
  _tone(freq, dur, opt={}){
    if(!this.ctx) return;
    const t=this.ctx.currentTime+(opt.delay||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=opt.type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(opt.slide) o.frequency.exponentialRampToValueAtTime(opt.slide, t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(opt.vol||0.25, t+(opt.attack||0.015));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.05);
  },

  /* 噪声爆发（水花/风声） */
  _burst(dur, opt={}){
    if(!this.ctx) return;
    const t=this.ctx.currentTime+(opt.delay||0);
    const src=this.ctx.createBufferSource(); src.buffer=this._noise; src.loop=true;
    const f=this.ctx.createBiquadFilter();
    f.type=opt.filter||'lowpass'; f.frequency.setValueAtTime(opt.freq||800,t);
    if(opt.freqSlide) f.frequency.exponentialRampToValueAtTime(opt.freqSlide, t+dur);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(opt.vol||0.3, t+(opt.attack||0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t+dur+0.1);
  },

  /* ---------- 蛙鸣 ---------- */
  croak(pitch=1){
    this._tone(150*pitch, 0.09, {type:'sawtooth', vol:0.12, slide:95*pitch});
    this._tone(140*pitch, 0.12, {type:'sawtooth', vol:0.1, slide:85*pitch, delay:0.12});
  },
  sadCroak(){
    this._tone(180, 0.28, {type:'sawtooth', vol:0.14, slide:70});
    this._tone(120, 0.4, {type:'sawtooth', vol:0.1, slide:55, delay:0.22});
  },

  /* ---------- 蓄力：持续上升的"憋劲"声 ---------- */
  chargeStart(){
    if(!this.ctx || this._charge) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='triangle'; o.frequency.value=170;
    g.gain.value=0.0001;
    g.gain.exponentialRampToValueAtTime(0.05, this.ctx.currentTime+0.08);
    o.connect(g); g.connect(this.master); o.start();
    this._charge=o; this._chargeGain=g;
  },
  chargeSet(p){
    if(this._charge) this._charge.frequency.value = 170 + p*520;
  },
  chargeStop(){
    if(!this._charge) return;
    const t=this.ctx.currentTime;
    try{
      this._chargeGain.gain.cancelScheduledValues(t);
      this._chargeGain.gain.setValueAtTime(this._chargeGain.gain.value, t);
      this._chargeGain.gain.exponentialRampToValueAtTime(0.0001, t+0.06);
      this._charge.stop(t+0.1);
    }catch(e){}
    this._charge=null; this._chargeGain=null;
  },

  /* ---------- 跳跃 / 落地 ---------- */
  jump(power=0.5){
    this._burst(0.22, {filter:'highpass', freq:600+power*900, vol:0.1+power*0.08, attack:0.01});
    this._tone(280+power*160, 0.2, {type:'sine', vol:0.14, slide:520+power*380});
  },
  land(){
    this._tone(170, 0.08, {type:'sine', vol:0.2});
    this._burst(0.12, {freq:900, freqSlide:250, vol:0.14, attack:0.005});
  },
  edge(){
    this._tone(430, 0.28, {type:'sine', vol:0.18, slide:250});
  },
  /* 连击音阶：五声音阶越连越高 */
  perfect(combo=1){
    const scale=[523,587,659,784,880,1047,1175,1319];
    const f=scale[Math.min(combo-1, scale.length-1)];
    this._tone(f, 0.16, {type:'triangle', vol:0.22});
    this._tone(f*1.5, 0.3, {type:'triangle', vol:0.16, delay:0.09});
  },
  gulp(){
    this._tone(330, 0.1, {type:'sine', vol:0.2, slide:110});
    this._tone(90, 0.08, {type:'sine', vol:0.16, delay:0.1});
  },
  splash(){
    this._burst(0.7, {freq:1400, freqSlide:160, vol:0.5, attack:0.006});
    this._tone(260, 0.3, {type:'sine', vol:0.2, slide:420, delay:0.1});
    this._tone(300, 0.25, {type:'sine', vol:0.14, slide:520, delay:0.24});
  },
  milestone(){
    [392,523,659].forEach((f,i)=>this._tone(f, 0.25, {delay:i*0.1, vol:0.2, type:'triangle'}));
  },
  gameOver(){
    [392,330,262,196].forEach((f,i)=>this._tone(f, 0.4, {delay:i*0.17, vol:0.18, type:'triangle'}));
  },
  click(){ this._tone(660, 0.07, {type:'square', vol:0.07}); },

  /* ---------- 氛围：水声底噪 + 夜晚虫鸣 + 雨声 ---------- */
  startAmbient(){
    if(!this.ctx || this._ambient) return;
    const src=this.ctx.createBufferSource(); src.buffer=this._noise; src.loop=true;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=220; f.Q.value=0.5;
    const g=this.ctx.createGain(); g.gain.value=0.028;
    src.connect(f); f.connect(g); g.connect(this.master); src.start();
    this._ambient=src; this._ambientGain=g;
  },

  /* 雨声（循环噪声，淡入淡出） */
  setRain(on){
    if(!this.ctx) return;
    if(on && !this._rain){
      const src=this.ctx.createBufferSource(); src.buffer=this._noise; src.loop=true;
      const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1300;
      const g=this.ctx.createGain(); g.gain.value=0.0001;
      src.connect(f); f.connect(g); g.connect(this.master); src.start();
      this._rain=src; this._rainGain=g;
    }
    if(this._rainGain){
      const t=this.ctx.currentTime;
      try{
        this._rainGain.gain.cancelScheduledValues(t);
        this._rainGain.gain.setValueAtTime(Math.max(this._rainGain.gain.value,0.0001), t);
        this._rainGain.gain.exponentialRampToValueAtTime(on?0.11:0.0001, t+1.2);
      }catch(e){}
    }
    if(!on && this._rain){ const src=this._rain; setTimeout(()=>{ try{src.stop();}catch(e){} }, 1400); this._rain=null; this._rainGain=null; }
  },

  /* 雷声（夏雨场景偶尔来一道） */
  thunder(){
    this._burst(1.8, {freq:320, freqSlide:50, vol:0.4, attack:0.05});
    this._burst(1.2, {freq:120, freqSlide:40, vol:0.3, attack:0.08, delay:0.15});
  },

  setNight(night){
    if(!this.ctx) return;
    if(night && !this._cricketTimer){
      const chirp=()=>{
        if(this.muted || !this.ctx) return;
        for(let i=0;i<3;i++) this._tone(4200+Math.random()*300, 0.05, {type:'square', vol:0.015, delay:i*0.09});
      };
      this._cricketTimer=setInterval(()=>{ if(Math.random()<0.7) chirp(); }, 2600);
      chirp();
    }else if(!night && this._cricketTimer){
      clearInterval(this._cricketTimer); this._cricketTimer=null;
    }
  },
};
try{ if(localStorage.getItem('fj_muted')==='1') A.muted=true; }catch(e){}
})();
</script>
<script>
/* ============================================================
   store.js — 全局响应式状态（Vue reactive）
   Three 引擎写入 → Vue UI 自动渲染；UI 事件 → 调引擎方法
   ============================================================ */
(function(){
const FJ = window.FJ = window.FJ || {};

FJ.store = Vue.reactive({
  /* 流程 */
  screen: 'loading',     // loading | start | play | over

  /* 对局数据 */
  score: 0,              // 本次跳过的格数（核心指标：看看能跳多少格）
  best: 0,               // 历史最佳格数
  combo: 0,              // 当前完美连击
  maxCombo: 0,
  perfects: 0,           // 完美卡点数
  jumps: 0,              // 起跳（卡点）次数
  pondIdx: 1,            // 第几片荷塘
  padInPond: 0,          // 本塘已跳格数（0..10）
  phaseName: '正午',
  sceneName: '夏 · 正午 ☀️',   // 当前风景：季节 · 时辰 · 天气

  /* QTE 进度条（引擎每帧写入） */
  qte: {
    active: false,       // 光标扫动中（飞行/结算时置 false，进度条变暗定格）
    marker: 0,           // 光标位置 0..1
    zoneC: 0.5,          // 绿区中心 0..1
    zoneW: 0.3,          // 绿区宽度（比例）
    moving: false,       // 漂移荷叶：绿区左右缓移
    result: '',          // 'perfect' | 'good' | 'miss'（命中后定格显示）
    resultText: '',
    sinkLeft: -1,        // 沉降荷叶倒计时 0..1（<0 表示无）
  },

  /* 控制 */
  paused: false,
  muted: false,
  tutorial: false,

  /* 浮动文字（引擎投影到屏幕坐标） */
  popups: [],
  popupId: 0,
  /* 里程碑吐司 */
  toasts: [],
  toastId: 0,

  /* 结算 */
  over: null,            // {icon,title,sub,score,isNewBest,maxCombo,perfects,ponds}
});

/* ---------------- 持久化 ---------------- */
try{ FJ.store.best = parseInt(localStorage.getItem('fj_best')||'0',10)||0; }catch(e){}
try{ FJ.store.muted = localStorage.getItem('fj_muted')==='1'; }catch(e){}
try{ FJ.store.tutorial = localStorage.getItem('fj_tut')!=='1'; }catch(e){}

FJ.saveBest = function(n){
  try{ localStorage.setItem('fj_best', String(n)); }catch(e){}
};
FJ.saveTutorialSeen = function(){
  FJ.store.tutorial = false;
  try{ localStorage.setItem('fj_tut','1'); }catch(e){}
};

/* ---------------- 行为（由 UI 调用，转发给引擎） ---------------- */
FJ.actions = {
  start(){
    FJ.audio.ensure();
    FJ.audio.startAmbient();
    FJ.audio.click();
    if(FJ.game) FJ.game.startGame();
  },
  restart(){
    FJ.audio.ensure();
    FJ.audio.click();
    if(FJ.game) FJ.game.startGame();
  },
  home(){
    FJ.audio.click();
    if(FJ.game) FJ.game.toHome();
  },
  press(){
    if(FJ.game) FJ.game.press();
  },
  togglePause(){
    const s=FJ.store;
    if(s.screen!=='play') return;
    s.paused=!s.paused;
    FJ.audio.click();
  },
  toggleMute(){
    const s=FJ.store; s.muted=!s.muted;
    FJ.audio.setMuted(s.muted);
  },
};

/* ---------------- 浮动文字（引擎在 3D 落点投影处弹出） ---------------- */
FJ.popup = function(text, cls, xPct, yPct){
  const s=FJ.store;
  const id=++s.popupId;
  s.popups.push({id, text, cls, x:xPct, y:yPct});
  if(s.popups.length>6) s.popups.shift();
  setTimeout(()=>{ const i=s.popups.findIndex(p=>p.id===id); if(i>=0) s.popups.splice(i,1); }, 950);
};

/* ---------------- 吐司 ---------------- */
FJ.toast = function(text){
  const s=FJ.store;
  const id=++s.toastId;
  s.toasts.push({id, text});
  if(s.toasts.length>3) s.toasts.shift();
  setTimeout(()=>{ const i=s.toasts.findIndex(t=>t.id===id); if(i>=0) s.toasts.splice(i,1); }, 2600);
};
})();
</script>
<script>

   pond.js — 荷塘世界（四季 × 时辰 × 天气）

   雨雪·花瓣·落叶粒子 / 涟漪水花彩带 / 8 塘风景剧本
   ============================================================ */
(function(){

const U = FJ.utils;

/* ---------------- 时辰（太阳起落路径，全部贴近地平线保证侧面可见） ----------------
   sunFrom/sunTo: 本时辰内太阳从哪走到哪（局部坐标，y=0 是水平线）

    sunFrom:{x:-20,y:2.2,c:'#ffd9a0'}, sunTo:{x:-4,y:8,c:'#fff0bd'} },
];

/* ---------------- 四季 ---------------- */
FJ.SEASONS = {

            flowers:['#ff8fb3','#fff3f6','#f6e27a'], reed:'#5d8a4a', drift:null, bug:true },

            flowers:['#ff9fc0','#ffd1e0','#fff6f0'], reed:'#6a9a52', drift:'#ffb7cf', bug:true },

/* ---------------- 8 塘风景剧本（循环） ---------------- */
FJ.SCENARIOS = [
  { time:0, season:'summer', weather:'clear', toast:'☀️ 盛夏正午，蚊虫正欢' },

const P = FJ.pond = {};

/* ================= 世界初始化 ================= */
P.init = function(scene){
  P.scene = scene;
  P.time = 0;
  P.seasonKey = 'summer';
  P.season = FJ.SEASONS.summer;
  P.weather = 'clear';
  P.camX = 0;
  P.dim = 1;

  _buildSky(scene);
  _buildWater(scene);
  _buildLights(scene);
  _buildStars(scene);
  _buildFireflies(scene);
  _buildParticles(scene);
  _buildPools(scene);
};

/* ================= 渐变天空穹顶 ================= */
function _buildSky(scene){
  const geo = new THREE.SphereGeometry(120, 24, 14);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms:{
      uTop:   { value:new THREE.Color(FJ.PHASES[0].skyTop) },
      uBot:   { value:new THREE.Color(FJ.PHASES[0].skyBot) },
    },
    vertexShader:`
      varying vec3 vP;
      void main(){ vP = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`
      uniform vec3 uTop; uniform vec3 uBot; varying vec3 vP;
      void main(){
        float h = clamp(vP.y/120.0*1.4 + 0.18, 0.0, 1.0);
        gl_FragColor = vec4(mix(uBot, uTop, h), 1.0);
      }`,
  });
  P.sky = new THREE.Mesh(geo, mat);
  scene.add(P.sky);
}

/* ================= 水面 ================= */
function _buildWater(scene){
  const geo = new THREE.PlaneGeometry(240, 240, 90, 90);
  geo.rotateX(-Math.PI/2);
  const mat = new THREE.ShaderMaterial({
    uniforms:{
      uTime:  { value:0 },
      uDeep:  { value:new THREE.Color(FJ.PHASES[0].waterDeep) },
      uLite:  { value:new THREE.Color(FJ.PHASES[0].waterLite) },
      uFogColor:{ value:new THREE.Color(FJ.PHASES[0].fog) },
      uFogNear: { value:22 },
      uFogFar:  { value:80 },
    },
    vertexShader:`
      uniform float uTime;
      varying vec3 vW; varying float vFogDepth;
      void main(){
        vec3 p = position;
        p.y += sin(p.x*0.55 + uTime*1.4)*0.05
             + sin(p.z*0.7  - uTime*1.1)*0.045
             + sin((p.x+p.z)*0.3 + uTime*0.7)*0.05;
        vec4 wp = modelMatrix * vec4(p,1.0);
        vW = wp.xyz;
        vFogDepth = -(modelViewMatrix * vec4(p,1.0)).z;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader:`
      uniform float uTime; uniform vec3 uDeep; uniform vec3 uLite;
      uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
      varying vec3 vW; varying float vFogDepth;
      void main(){
        float s1 = sin(vW.x*1.35 + uTime*1.6) * sin(vW.z*1.65 - uTime*1.2);
        float s2 = sin(vW.x*3.1 - uTime*2.2) * sin(vW.z*2.6 + uTime*1.7);
        float glint = smoothstep(0.55, 1.0, s1) * 0.5 + smoothstep(0.72, 1.0, s2) * 0.3;
        vec3 col = mix(uDeep, uLite, clamp(glint + 0.12, 0.0, 1.0));
        col += uLite * smoothstep(0.86, 1.0, s2) * 0.35;
        float f = smoothstep(uFogNear, uFogFar, vFogDepth);
        col = mix(col, uFogColor, f);
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  P.water = new THREE.Mesh(geo, mat);
  scene.add(P.water);
}

/* ================= 光照 ================= */
function _buildLights(scene){
  P.hemi = new THREE.HemisphereLight('#bfe8ff', '#2f5d46', 0.9);
  scene.add(P.hemi);

  P.dir.position.set(6, 12, 4);

}

/* ================= 星月日（都放在地平线附近的可见带） ================= */
function _buildStars(scene){
  /* 低空星带：侧面视角下视野只露出地平线上方一条天空 */
  const N=200, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]   = U.rand(-85,85);
    pos[i*3+1] = U.rand(3,26);
    pos[i*3+2] = U.rand(-95,-50);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  P.stars = new THREE.Points(g, new THREE.PointsMaterial({
    size:1.8, map:U.softDot('rgba(255,255,255,1)'), transparent:true,
    opacity:0, depthWrite:false, sizeAttenuation:false, fog:false,
  }));
  scene.add(P.stars);

  /* 月亮（低悬） */
  P.moon = new THREE.Group();
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(5, 40),
    new THREE.MeshBasicMaterial({ color:'#f4f0d8', transparent:true, opacity:0, fog:false })
  );
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map:U.glowTex('rgba(230,235,255,0.9)'), transparent:true, opacity:0, depthWrite:false, fog:false,
  }));
  halo.scale.set(26,26,1);
  P.moon.add(disc, halo);
  P.moonDisc=disc; P.moonHalo=halo;
  P.moon.position.set(-26, 11, -62);
  P.moon.lookAt(0,0,0);
  scene.add(P.moon);

  /* 太阳（随行程起落） */
  P.sun = new THREE.Group();
  const sunDisc = new THREE.Mesh(
    new THREE.CircleGeometry(6.2, 40),
    new THREE.MeshBasicMaterial({ color:'#fff6cf', transparent:true, opacity:1, fog:false })
  );
  const sunHalo = new THREE.Sprite(new THREE.SpriteMaterial({
    map:U.glowTex('rgba(255,225,150,0.95)'), transparent:true, opacity:0.9, depthWrite:false, fog:false,
  }));
  sunHalo.scale.set(34,34,1);
  P.sun.add(sunDisc, sunHalo);
  P.sunDisc=sunDisc; P.sunHalo=sunHalo;
  P.sunLX=12; P.sunLY=12.5;
  P.sun.position.set(P.camX+P.sunLX, P.sunLY, -85);
  P.sun.lookAt(P.camX,0,0);
  scene.add(P.sun);
}

/* ================= 萤火虫（夜晚出没，跟随镜头一带） ================= */

/* ================= 雨雪 + 季节飘落物 ================= */
function _buildParticles(scene){
  /* 雨 */
  {
    const N=120, pos=new Float32Array(N*3);
    for(let i=0;i<N;i++){
      pos[i*3]=U.rand(-11,13); pos[i*3+1]=U.rand(0,10); pos[i*3+2]=U.rand(-6,7);
    }

    g.setAttribute('position', new THREE.BufferAttribute(pos,3));

    }));

  {
    const N=90, pos=new Float32Array(N*3);
    for(let i=0;i<N;i++){

    }

    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    P.snow=new THREE.Points(g, new THREE.PointsMaterial({
      size:0.19, map:U.softDot('rgba(255,255,255,1)'), transparent:true,
      opacity:0, depthWrite:false,
    }));
    P.snow.visible=false; P._snowV=[];
    for(let i=0;i<N;i++) P._snowV.push(U.rand(0.7,1.5));
    scene.add(P.snow);
  }

    }

    g.setAttribute('position', new THREE.BufferAttribute(pos,3));

/* ================= 特效池：涟漪 + 水花 + 彩带 ================= */
function _buildPools(scene){
  P.ripples=[];
  const rGeo=new THREE.RingGeometry(0.82, 1, 36);
  rGeo.rotateX(-Math.PI/2);
  for(let i=0;i<22;i++){
    const m=new THREE.Mesh(rGeo, new THREE.MeshBasicMaterial({
      color:'#ffffff', transparent:true, opacity:0, depthWrite:false,
    }));
    m.visible=false; scene.add(m);
    P.ripples.push({mesh:m, t:-1, dur:1, scaleTo:2.4});
  }
  P.splashes=[];
  for(let i=0;i<3;i++){
    const N=42, g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3),3));
    const pts=new THREE.Points(g, new THREE.PointsMaterial({
      size:0.22, map:U.softDot('rgba(220,245,255,1)'), transparent:true,
      opacity:0, depthWrite:false,
    }));
    pts.visible=false; scene.add(pts);
    P.splashes.push({pts, t:-1, dur:0.9, vel:null, origin:new THREE.Vector3(), power:1});
  }
  P.confettis=[];
  const palette=[[1,0.84,0.35],[1,0.56,0.7],[0.55,0.9,0.68],[0.65,0.85,1],[1,1,1]];
  for(let i=0;i<2;i++){
    const N=70, g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3),3));
    const cols=new Float32Array(N*3);
    for(let k=0;k<N;k++){
      const c=palette[k%palette.length];
      cols[k*3]=c[0]; cols[k*3+1]=c[1]; cols[k*3+2]=c[2];
    }
    g.setAttribute('color', new THREE.BufferAttribute(cols,3));
    const pts=new THREE.Points(g, new THREE.PointsMaterial({
      size:0.3, map:U.softDot('rgba(255,255,255,1)'), transparent:true,
      opacity:0, depthWrite:false, vertexColors:true,
    }));
    pts.visible=false; scene.add(pts);
    P.confettis.push({pts, t:-1, dur:1.7, vel:null});
  }
}

/* 涟漪：在 (x,z) 处荡开一圈 */
P.ripple = function(x, z, scaleTo=2.2, dur=1.0){
  const r=P.ripples.find(r=>r.t<0); if(!r) return;
  r.t=0; r.dur=dur; r.scaleTo=scaleTo;
  r.mesh.position.set(x, 0.07, z);
  r.mesh.visible=true;
};

/* 水花：power 0~1 */
P.splash = function(x, z, power=1){
  const s=P.splashes.find(s=>s.t<0); if(!s) return;
  const N=s.pts.geometry.attributes.position.count;
  const vel=new Float32Array(N*3);
  const pos=s.pts.geometry.attributes.position.array;
  for(let i=0;i<N;i++){
    const a=U.rand(0,Math.PI*2), sp=U.rand(0.6,2.4)*power;
    vel[i*3]=Math.cos(a)*sp*0.6;
    vel[i*3+1]=U.rand(1.4,3.4)*power;
    vel[i*3+2]=Math.sin(a)*sp*0.6;
    pos[i*3]=x; pos[i*3+1]=0.06; pos[i*3+2]=z;
  }
  s.pts.geometry.attributes.position.needsUpdate=true;
  s.origin.set(x,0,z);
  s.vel=vel; s.t=0; s.dur=0.75+0.35*power; s.power=power;
  s.pts.material.opacity=0.95;
  s.pts.visible=true;
};

/* 彩带：渡塘庆祝 */
P.confetti = function(x, y, z){
  const s=P.confettis.find(s=>s.t<0); if(!s) return;
  const N=s.pts.geometry.attributes.position.count;
  const vel=new Float32Array(N*3);
  const pos=s.pts.geometry.attributes.position.array;
  for(let i=0;i<N;i++){
    const a=U.rand(0,Math.PI*2), sp=U.rand(0.8,2.6);
    vel[i*3]=Math.cos(a)*sp;
    vel[i*3+1]=U.rand(2.2,5.0);
    vel[i*3+2]=Math.sin(a)*sp*0.7;
    pos[i*3]=x+U.rand(-0.4,0.4); pos[i*3+1]=y; pos[i*3+2]=z+U.rand(-0.4,0.4);
  }
  s.pts.geometry.attributes.position.needsUpdate=true;
  s.vel=vel; s.t=0; s.dur=1.7;
  s.pts.material.opacity=1;
  s.pts.visible=true;
};

/* ================= 场景切换接口 ================= */
P.setSeason = function(key){
  P.seasonKey = key;
  P.season = FJ.SEASONS[key] || FJ.SEASONS.summer;
  /* 季节飘落物 */
  if(P.season.drift){
    P.drift.material.color.set(P.season.drift);
    P.drift.visible = true;
  }else{
    P.drift.visible = false;
  }
};

P.setWeather = function(key){
  P.weather = key;
  P.rain.visible = key==='rain';
  P.rain.material.opacity = key==='rain' ? 0.5 : 0;
  P.snow.visible = key==='snow';
  P.snow.material.opacity = key==='snow' ? 0.9 : 0;
  if(P.season.drift && key!=='snow') P.drift.visible = true;
  if(key==='snow') P.drift.visible = false;   /* 雪天不飘花瓣 */
  if(FJ.audio) FJ.audio.setRain(key==='rain');
};

P.setPhaseTarget = function(phase){
  P._target = phase;
  P.starTarget = phase.star;
};

/* 太阳随行程起落：p 0..1 为本塘进度 */
P.setSun = function(p){
  const ph = P._target || FJ.PHASES[0];
  const f = ph.sunFrom, t = ph.sunTo;
  P._sunP = U.clamp(p, 0, 1);
};

P.setCamX = function(x){ P.camX = x; };

/* ================= 荷叶工厂（随季节变色） ================= */
/* 新建一片荷叶：r 半径，axis 上一格→本格方向（决定纹理朝向） */
P.createPad = function(x, z, r, axis){
  const g=new THREE.Group();
  g.position.set(x, 0, z);
  const season = P.season || FJ.SEASONS.summer;

  /* 叶身（带缺口的圆，颜色取当季调色板） */
  const col=U.pick(season.pads);
  const leaf=new THREE.Mesh(
    new THREE.CircleGeometry(r, 34, 0.22, Math.PI*2-0.44),
    new THREE.MeshStandardMaterial({ color:col, roughness:0.62, metalness:0.05, side:THREE.DoubleSide })
  );
  leaf.rotation.x=-Math.PI/2;
  leaf.rotation.z=U.rand(0,Math.PI*2);
  leaf.position.y=0.075;
  g.add(leaf);

  /* 叶脉 */
  const veinGeo=new THREE.RingGeometry(r*0.16, r*0.19, 20, 1, 0, Math.PI*2-0.44);
  veinGeo.rotateX(-Math.PI/2);
  const vein=new THREE.Mesh(veinGeo, new THREE.MeshBasicMaterial({
    color:'#dff0c8', transparent:true, opacity:0.26, depthWrite:false,
  }));
  vein.position.y=0.081; vein.rotation.z=leaf.rotation.z;
  g.add(vein);

  /* 冬季：叶心积雪 */
  if(season.snowOnPad){
    const cap=new THREE.Mesh(
      new THREE.CircleGeometry(r*0.62, 22),
      new THREE.MeshStandardMaterial({ color:'#eef4f8', roughness:0.95, transparent:true, opacity:0.85 })
    );
    cap.rotation.x=-Math.PI/2;
    cap.position.set(U.rand(-r*0.12,r*0.12), 0.088, U.rand(-r*0.12,r*0.12));
    g.add(cap);
  }

  /* 荷花（当季花色与概率） */
  if(Math.random() < season.flowerChance) _addLotus(g, r, U.pick(season.flowers));

  /* 芦苇（当季色） */
  if(Math.random()<0.25) _addReed(g, r, axis, season.reed);

  P.scene.add(g);
  return g;
};

/* 小荷花 */
function _addLotus(g, r, col){
  const fl=new THREE.Group();
  const petalGeo=new THREE.SphereGeometry(0.075, 8, 8);
  for(let i=0;i<7;i++){
    const p=new THREE.Mesh(petalGeo, new THREE.MeshStandardMaterial({
      color:col, roughness:0.5,
    }));
    const a=i/7*Math.PI*2;
    p.position.set(Math.cos(a)*0.085, 0.05, Math.sin(a)*0.085);
    p.scale.set(1, 1.7, 0.55);
    p.rotation.y=-a;
    fl.add(p);
  }
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.045,10,10),
    new THREE.MeshStandardMaterial({color:'#ffd76a', roughness:0.4}));
  core.position.y=0.12;
  fl.add(core);
  fl.position.set(U.rand(-r*0.4,r*0.4), 0.07, U.rand(-r*0.4,r*0.4));
  g.add(fl);
}

/* 芦苇（细杆 + 香蒲穗） */
function _addReed(g, r, axis, reedCol){
  const cl=new THREE.Group();
  const n=Math.floor(U.rand(2,5));
  for(let i=0;i<n;i++){
    const h=U.rand(1.1,2.1);
    const stem=new THREE.Mesh(
      new THREE.CylinderGeometry(0.016,0.024,h,6),
      new THREE.MeshStandardMaterial({color:reedCol||'#5d8a4a', roughness:0.9})
    );
    stem.position.y=h/2;
    const tip=new THREE.Mesh(
      new THREE.CylinderGeometry(0.05,0.05,0.34,8),
      new THREE.MeshStandardMaterial({color:'#7a4a2e', roughness:0.95})
    );
    tip.position.y=h+0.12;
    const one=new THREE.Group();
    one.add(stem,tip);
    one.position.set(U.rand(-0.25,0.25), 0, U.rand(-0.25,0.25));
    one.rotation.z=U.rand(-0.09,0.09);
    cl.add(one);
  }
  const side=(Math.random()<0.5?-1:1);
  const perp={x:-axis.z, z:axis.x};
  const d=r+U.rand(0.55,1.1);
  cl.position.set(perp.x*side*d + axis.x*U.rand(-0.5,0.5), -0.1, perp.z*side*d + axis.z*U.rand(-0.5,0.5));
  g.add(cl);
}

/* 荷叶上的小飞虫 */

/* ================= 堤岸（每片荷塘的终点 = 下一段小路） ================= */
P.createBank = function(x){
  const g=new THREE.Group();

  const mound=new THREE.Mesh(
    new THREE.BoxGeometry(3.4, 0.55, 4.2),
    new THREE.MeshStandardMaterial({ color:'#5da55e', roughness:0.9 })
